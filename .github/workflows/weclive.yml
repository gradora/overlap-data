name: weclive

# Частый прогон ТОЛЬКО идущего этапа WEC. Появился в шаге 3c DATA-PLAN: из
# приложения удалён HTML-каскад fiawec, и вместе с ним — обходной путь свежести.
# Пока каскад жил, только что закончившаяся сессия приезжала к пользователю
# сразу: её страницы нет в зеркале (продьюсер зеркалит страницу сессии ТОЛЬКО
# когда на ней уже есть таблица), mirror-first транспорт промахивался и шёл
# прямо в fiawec. Теперь единственный источник — снапшот, и свежесть уик-энда
# упирается в каденс крона. А он рваный: snapshot.yml объявлен как «17 * * * *»,
# но GitHub роняет часть расписаний — 27.08.2026 наблюдались разрывы 4.6 ч и
# 10.25 ч. Пользователь в субботу видел бы карточку сессии «Finished» с пустой
# таблицей под ней.
#
# Расписание — каждые 15 минут ВСЕ дни: у WEC уик-энды разбросаны по календарю
# (Ле-Ман — целая неделя, прологи среди недели), фильтр по дням недели тут не
# работает. Цена холостого прогона близка к нулю: продьюсер читает index.json из
# чекаута и, не найдя идущего этапа, выходит НЕ КОСНУВШИСЬ СЕТИ.
on:
  # ВРЕМЕННО ОТКЛЮЧЕНО на время перезаписи истории (вернуть сразу после):
  # schedule:
  # - cron: "*/15 * * * *"
  workflow_dispatch: {}

# СВОЯ группа (не snapshot) — по той же причине, что у fia.yml: GitHub держит
# максимум ОДИН pending-прогон на группу, и 15-минутные прогоны, вставшие в
# очередь за часовым snapshot, молча дропались бы ровно в уик-энд. Писать
# параллельно безопасно: этот воркфлоу коммитит только страницы своего этапа и
# витрину WEC, а commit-push ребейзится.
concurrency:
  group: weclive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weclive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Идущий этап WEC
        run: npm run weclive

      - name: Закоммитить WEC
        if: always()
        uses: ./.github/actions/commit-push
        with:
          paths: data/wec
          message-prefix: weclive
