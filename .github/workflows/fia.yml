name: fia

# Лёгкий частый прогон ТОЛЬКО FIA-штрафов/грида на гоночные уик-энды: во время
# сессий решения стюардов и стартовая решётка меняются в реальном времени, а
# основной snapshot (WEC/IMSA/Jolpica-records с рейт-лимитами) частить нельзя.
# Пн–Чт хватает почасового snapshot; здесь — Пт/Сб/Вс каждые 15 минут.
on:
  schedule:
    - cron: "*/15 * * * 5,6,0"
  workflow_dispatch: {}

# СВОЯ группа (не snapshot): GitHub держит максимум ОДИН pending-прогон на
# группу — 15-минутные fia-прогоны, вставшие в очередь за часовым snapshot
# (который молотит 17 продьюсеров с паузами), молча дропались — ровно в
# гоночный уик-энд, когда штрафы нужны быстрее всего. Писать параллельно
# безопасно: fia коммитит только data/f1/fia, snapshot ребейзится в push-цикле.
concurrency:
  group: fia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: FIA-штрафы
        run: npm run fia

      - name: Закоммитить FIA
        if: always()
        run: |
          git config user.name  "overlap-bot"
          git config user.email "overlap-bot@users.noreply.github.com"
          git add data/f1/fia
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "fia $(date -u +%FT%TZ)"
          # Устойчивый push: гонка с snapshot-коммитом или блип не должны валить.
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then
              echo "push ок с попытки $attempt"
              exit 0
            fi
            echo "::warning::push не удался (попытка $attempt/5), повтор через 10с"
            sleep 10
          done
          echo "::error::push не удался после 5 попыток"
          exit 1
