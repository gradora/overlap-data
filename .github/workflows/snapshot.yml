name: snapshot

on:
  schedule:
    # раз в час; частить не нужно — финалы этапов замораживаются
    - cron: "17 * * * *"
    # раз в сутки — проход сезона N+1 (шаг «Сезон N+1» ниже различает
    # расписания по github.event.schedule)
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      next_season:
        description: "Прогнать также сезон N+1"
        type: boolean
        default: false

# не запускать параллельные прогоны (перезапись data/)
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Продьюсеры — с continue-on-error: один сломанный источник не блокирует
      # остальные и коммит. Реальный результат каждого уходит в health-шаг через
      # steps.<id>.outcome; health валит job (→ письмо GitHub), если что-то упало.
      - name: Собрать снапшоты IMSA
        id: imsa
        continue-on-error: true
        run: npm run imsa

      - name: Зеркало F1 (Jolpica)
        id: f1
        continue-on-error: true
        run: npm run f1

      - name: Зеркало OpenF1 (детали протокола)
        id: openf1
        continue-on-error: true
        run: npm run openf1

      - name: Зеркало WEC (fiawec)
        id: wec
        continue-on-error: true
        run: npm run wec

      - name: Решения стюардов WEC (Notice Board)
        id: wecfia
        continue-on-error: true
        run: npm run wecfia

      - name: Хайлайты гонок WEC (Al Kamel)
        id: wechighlights
        continue-on-error: true
        run: npm run wechighlights

      - name: Победители трасс WEC (Al Kamel)
        id: wecwinners
        continue-on-error: true
        run: npm run wecwinners

      - name: Решения IMSA (Notice Board)
        id: imsafia
        continue-on-error: true
        run: npm run imsafia

      - name: Хайлайты гонок IMSA (Al Kamel)
        id: imsahighlights
        continue-on-error: true
        run: npm run imsahighlights

      - name: Победители трасс IMSA (Al Kamel)
        id: imsawinners
        continue-on-error: true
        run: npm run imsawinners

      - name: Решения стюардов FIA (штрафы)
        id: fia
        continue-on-error: true
        run: npm run fia

      - name: Победители прошлых лет (Jolpica)
        id: winners
        continue-on-error: true
        run: npm run f1winners

      - name: Хайлайты уик-энда (деривация из зеркала)
        id: highlights
        continue-on-error: true
        run: npm run f1highlights

      - name: Юбилеи пилотов (Jolpica)
        id: milestones
        continue-on-error: true
        run: npm run f1milestones

      - name: Day in history — индекс гонок по дням (Jolpica)
        id: f1history
        continue-on-error: true
        run: npm run f1history

      - name: Beasts of the season — камбэки и питы (Jolpica + highlights)
        id: beasts
        continue-on-error: true
        run: npm run f1beasts

      - name: Sport milestones — all-time рекорды F1 (Jolpica)
        id: records
        continue-on-error: true
        run: npm run f1records

      # Экран команды: полоска формы по этапам, своды Гран-при и спринтов,
      # дуэль напарников, камбэки и лучшие питы. Стоит ПОСЛЕ f1 и openf1 —
      # читает зеркала current.json (календарь + season-guard) и
      # current_constructorStandings.json (состав, место, очки), а питы берёт
      # из зеркала OpenF1; раньше openf1 блок питов отставал бы на прогон.
      # ИНЦИДЕНТ 2026-08: продьюсер написан 07.08, но забыт в этом файле —
      # единственный из всех. Крон его не звал ни разу, экран команды простоял
      # на данных R11 семнадцать дней и пропустил Зандворт (R12). Класс ошибки
      # закрыт тестом «каждый npm-скрипт-продьюсер запускается воркфлоу С
      # РАСПИСАНИЕМ» (src/workflows.test.ts) — молча потеряться больше нельзя.
      - name: Экран команды F1 (Jolpica + OpenF1)
        id: f1teams
        continue-on-error: true
        run: npm run f1teams

      # Сезон N+1 — раз в сутки. Это авто-открытие следующего года в
      # приложении: f1 пишет <N+1>.json ТОЛЬКО когда jolpica опубликовал
      # календарь, и mirror-first проба переключателя сезонов видит его; wec
      # подхватывает дозаполнение времён сессий (страницы будущих этапов не
      # замораживаются); imsa обновляет index/tests из SCHEDULE[N+1] и папки
      # Al Kamel — ноябрьский тест сезона N+1 живёт в календарном году N и
      # нужен ленте уже осенью; openf1 зеркалит ЛИСТИНГ митингов N+1 (и только
      # его — режим «future»): тесты и отмены следующего года есть только там,
      # и без этого шага витрина календаря N+1 собиралась без них молча.
      # До публикации источников все четыре выходят тихо.
      - name: Сезон N+1 (ежесуточно)
        id: nextseason
        if: github.event.schedule == '37 3 * * *' || inputs.next_season
        continue-on-error: true
        run: |
          NEXT=$(( $(date -u +%Y) + 1 ))
          FAIL=0
          SEASON=$NEXT npm run f1     || FAIL=1
          SEASON=$NEXT npm run openf1 || FAIL=1
          SEASON=$NEXT npm run wec    || FAIL=1
          SEASON=$NEXT npm run imsa   || FAIL=1
          exit $FAIL

      # После зеркал f1 и openf1: правило «переехало» читает свежий current.json,
      # а витрина календаря (data/f1/calendar/<год>.json, фаза 4 DATA-PLAN) —
      # ОБА зеркала этого прогона плюс уже почищенную ручку. Своего шага у
      # витрины нет намеренно: сети в ней нет, только файлы на диске, и она
      # обязана идти строго после GC (иначе отжившая запись на час въезжает в
      # календарь). Обоснование выбора продьюсера — шапка f1overrides.ts.
      - name: GC override-календаря F1 + витрина календаря
        id: f1overrides
        continue-on-error: true
        run: npm run f1overrides

      # Историческая погода событий F1 (шаг 5.3). Бессетевой, как витрина:
      # берёт листинги сессий и погоду из УЖЕ снятого зеркала openf1, а сшивает
      # через sourceIds.openf1.meetingKey витрины — поэтому обязан идти ПОСЛЕ
      # обоих (openf1 выше, f1overrides строкой выше).
      - name: Погода событий F1
        id: f1weather
        continue-on-error: true
        run: npm run f1weather

      # Заявка сезона с разрезолвленными личностями (D4 фазы 6). Бессетевая:
      # заявка jolpica (кто допущен, включая резервистов) × строки пилотов по
      # митингам OpenF1. Обязана идти ПОСЛЕ обоих зеркал.
      - name: Заявка сезона F1
        id: f1entrylist
        continue-on-error: true
        run: npm run f1entrylist

      # Файл события F1 (фаза 6) — проекция уже собранных семейств в один
      # документ. Сети нет вовсе, только локальные файлы, поэтому шаг обязан
      # идти ПОСЛЕДНИМ из содержательных: всё, что собрано этим прогоном
      # (штрафы, победители, хайлайты, вехи, витрина с ключами), попадает в
      # проекцию сразу, а не спустя час.
      - name: Файл события F1
        id: f1events
        continue-on-error: true
        run: npm run f1events

      # Пишет data/health.json (дневной heartbeat — держит крон живым в
      # межсезонье + сигнал устаревания приложению + отметки свежести
      # lastSuccess/firstSeen/stale по реестру src/lib/producers.ts). Реальные
      # результаты продьюсеров приходят через steps.<id>.outcome. Только пишет
      # файл: оба гейта после коммита решают, валить ли job.
      - name: Health heartbeat
        if: always()
        env:
          IMSA_OUTCOME: ${{ steps.imsa.outcome }}
          F1_OUTCOME: ${{ steps.f1.outcome }}
          OPENF1_OUTCOME: ${{ steps.openf1.outcome }}
          WEC_OUTCOME: ${{ steps.wec.outcome }}
          FIA_OUTCOME: ${{ steps.fia.outcome }}
          WECFIA_OUTCOME: ${{ steps.wecfia.outcome }}
          WECHIGHLIGHTS_OUTCOME: ${{ steps.wechighlights.outcome }}
          WECWINNERS_OUTCOME: ${{ steps.wecwinners.outcome }}
          IMSAFIA_OUTCOME: ${{ steps.imsafia.outcome }}
          IMSAHIGHLIGHTS_OUTCOME: ${{ steps.imsahighlights.outcome }}
          IMSAWINNERS_OUTCOME: ${{ steps.imsawinners.outcome }}
          WINNERS_OUTCOME: ${{ steps.winners.outcome }}
          HIGHLIGHTS_OUTCOME: ${{ steps.highlights.outcome }}
          MILESTONES_OUTCOME: ${{ steps.milestones.outcome }}
          F1HISTORY_OUTCOME: ${{ steps.f1history.outcome }}
          BEASTS_OUTCOME: ${{ steps.beasts.outcome }}
          RECORDS_OUTCOME: ${{ steps.records.outcome }}
          F1TEAMS_OUTCOME: ${{ steps.f1teams.outcome }}
          F1OVERRIDES_OUTCOME: ${{ steps.f1overrides.outcome }}
          F1WEATHER_OUTCOME: ${{ steps.f1weather.outcome }}
          F1ENTRYLIST_OUTCOME: ${{ steps.f1entrylist.outcome }}
          F1EVENTS_OUTCOME: ${{ steps.f1events.outcome }}
          NEXTSEASON_OUTCOME: ${{ steps.nextseason.outcome }}
        run: npm run health

      - name: Закоммитить изменения
        if: always()
        uses: ./.github/actions/commit-push
        with:
          paths: data
          message-prefix: snapshot

      # Гейт алерта: любой продьюсер с outcome=failure валит job → GitHub шлёт
      # владельцу письмо. Данные/heartbeat уже закоммичены выше (это отдельный
      # шаг после), поэтому падение не мешает публикации того, что собралось.
      - name: Проверка продьюсеров
        if: always()
        run: |
          FAILED=""
          for p in "imsa=${{ steps.imsa.outcome }}" "f1=${{ steps.f1.outcome }}" \
                   "openf1=${{ steps.openf1.outcome }}" "wec=${{ steps.wec.outcome }}" \
                   "fia=${{ steps.fia.outcome }}" "wecfia=${{ steps.wecfia.outcome }}" "wechighlights=${{ steps.wechighlights.outcome }}" "wecwinners=${{ steps.wecwinners.outcome }}" "imsafia=${{ steps.imsafia.outcome }}" "imsahighlights=${{ steps.imsahighlights.outcome }}" "imsawinners=${{ steps.imsawinners.outcome }}" "winners=${{ steps.winners.outcome }}" "highlights=${{ steps.highlights.outcome }}" "milestones=${{ steps.milestones.outcome }}" "f1history=${{ steps.f1history.outcome }}" "beasts=${{ steps.beasts.outcome }}" "records=${{ steps.records.outcome }}" "f1teams=${{ steps.f1teams.outcome }}" "f1overrides=${{ steps.f1overrides.outcome }}" "f1weather=${{ steps.f1weather.outcome }}" "f1entrylist=${{ steps.f1entrylist.outcome }}" "f1events=${{ steps.f1events.outcome }}" \
                   "nextseason=${{ steps.nextseason.outcome }}"; do
            name="${p%%=*}"; outcome="${p##*=}"
            if [ "$outcome" = "failure" ]; then FAILED="$FAILED $name"; fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::упали продьюсеры:$FAILED — см. data/health.json"
            exit 1
          fi
          echo "все продьюсеры ОК"

      # Гейт свежести: ловит не «сломался», а «не отрабатывает». Гейт выше видит
      # только шаги, которые в этом файле УЖЕ ЕСТЬ, — продьюсера, которого сюда
      # забыли вписать, он не видит по построению (так f1teams простоял 17
      # суток, и заметил это владелец, а не система). Реестр src/lib/producers.ts
      # объявлен НЕЗАВИСИМО от проводки: нет шага → никто не обновляет
      # lastSuccess → отметка стареет → через бюджет тревога здесь.
      #
      # Факты считает health.ts и кладёт в data/health.json → stale (кто, сколько
      # суток молчит, бюджет, канал). Решение об алерте — здесь: то же
      # разделение «скрипт пишет, YAML решает», что и у гейта выше.
      #
      # Стоит ПОСЛЕ шага коммита — данные и heartbeat уже опубликованы, падение
      # гейта их не задерживает. `if: always()` — чтобы проверка отработала и
      # тогда, когда гейт продьюсеров выше уже свалил job.
      - name: Проверка свежести данных
        if: always()
        run: |
          STALE=$(node -e '
            const fs = require("node:fs");
            let h;
            try {
              h = JSON.parse(fs.readFileSync("data/health.json", "utf8"));
            } catch (e) {
              console.log("health.json не прочитан (" + e.message + ") — heartbeat не записался, свежесть неизвестна");
              process.exit(0);
            }
            // Гейт судит по ВЕРДИКТУ ИЗ ФАЙЛА, поэтому обязан сперва
            // убедиться, что файл сегодняшний и нужной схемы. Иначе сторож
            // против тихого отказа сам отказывает тихо: замороженный, но
            // читаемый health.json (шагу health дописали continue-on-error,
            // погасили его через `if:`, откатили схему) держал бы гейт вечно
            // зелёным — и мы вернулись бы ровно туда, откуда начинали.
            const today = new Date().toISOString().slice(0, 10);
            if (h.date !== today) {
              console.log("health.json от " + h.date + ", сегодня " + today
                + " — heartbeat не обновился в этом прогоне, шаг «Health heartbeat» не отработал");
            }
            if (!Array.isArray(h.stale)) {
              console.log("в health.json нет массива stale — схема разъехалась с гейтом,"
                + " проверка свежести не работает (src/producers/health.ts)");
            }
            for (const s of Array.isArray(h.stale) ? h.stale : []) {
              console.log(s.producer + ": молчит " + s.days + " сут при бюджете " + s.budgetDays
                + (s.everRan
                    ? ", последний успешный прогон " + s.since
                    : ", НИ РАЗУ не отрабатывал успешно, в реестре с " + s.since)
                + " — его канал " + s.workflow);
            }
          ')
          if [ -n "$STALE" ]; then
            echo "::error::проверка свежести не пройдена:"
            echo "$STALE" | while IFS= read -r line; do echo "::error::  $line"; done
            echo "::error::что делать — проверь, что продьюсер реально вызывается воркфлоу ПО РАСПИСАНИЮ (шаг с id + строка в гейте «Проверка продьюсеров» + переменная <KEY>_OUTCOME в env шага health) и что он не падает; реестр и бюджеты — src/lib/producers.ts, накопленные отметки — data/health.json → lastSuccess/firstSeen"
            exit 1
          fi
          echo "свежесть ОК"
