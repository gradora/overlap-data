name: snapshot

on:
  schedule:
    # раз в час; частить не нужно — финалы этапов замораживаются
    - cron: "17 * * * *"
  workflow_dispatch: {}

# не запускать параллельные прогоны (перезапись data/)
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Продьюсеры — с continue-on-error: один сломанный источник не блокирует
      # остальные и коммит. Реальный результат каждого уходит в health-шаг через
      # steps.<id>.outcome; health валит job (→ письмо GitHub), если что-то упало.
      - name: Собрать снапшоты IMSA
        id: imsa
        continue-on-error: true
        run: npm run imsa

      - name: Зеркало F1 (Jolpica)
        id: f1
        continue-on-error: true
        run: npm run f1

      - name: Зеркало OpenF1 (детали протокола)
        id: openf1
        continue-on-error: true
        run: npm run openf1

      - name: Зеркало WEC (fiawec)
        id: wec
        continue-on-error: true
        run: npm run wec

      - name: Решения стюардов WEC (Notice Board)
        id: wecfia
        continue-on-error: true
        run: npm run wecfia

      - name: Хайлайты гонок WEC (Al Kamel)
        id: wechighlights
        continue-on-error: true
        run: npm run wechighlights

      - name: Победители трасс WEC (Al Kamel)
        id: wecwinners
        continue-on-error: true
        run: npm run wecwinners

      - name: Решения IMSA (Notice Board)
        id: imsafia
        continue-on-error: true
        run: npm run imsafia

      - name: Хайлайты гонок IMSA (Al Kamel)
        id: imsahighlights
        continue-on-error: true
        run: npm run imsahighlights

      - name: Победители трасс IMSA (Al Kamel)
        id: imsawinners
        continue-on-error: true
        run: npm run imsawinners

      - name: Решения стюардов FIA (штрафы)
        id: fia
        continue-on-error: true
        run: npm run fia

      - name: Победители прошлых лет (Jolpica)
        id: winners
        continue-on-error: true
        run: npm run f1winners

      - name: Хайлайты уик-энда (деривация из зеркала)
        id: highlights
        continue-on-error: true
        run: npm run f1highlights

      - name: Юбилеи пилотов (Jolpica)
        id: milestones
        continue-on-error: true
        run: npm run f1milestones

      - name: Day in history — индекс гонок по дням (Jolpica)
        id: f1history
        continue-on-error: true
        run: npm run f1history

      - name: Beasts of the season — камбэки и питы (Jolpica + highlights)
        id: beasts
        continue-on-error: true
        run: npm run f1beasts

      - name: Sport milestones — all-time рекорды F1 (Jolpica)
        id: records
        continue-on-error: true
        run: npm run f1records

      # После зеркала f1: правило «переехало» читает свежий current.json.
      - name: GC override-календаря F1 (отжившие ручные записи)
        id: f1overrides
        continue-on-error: true
        run: npm run f1overrides

      # Пишет data/health.json (дневной heartbeat — держит крон живым в
      # межсезонье + сигнал устаревания приложению). Реальные результаты
      # продьюсеров приходят через steps.<id>.outcome. Только пишет файл.
      - name: Health heartbeat
        if: always()
        env:
          IMSA_OUTCOME: ${{ steps.imsa.outcome }}
          F1_OUTCOME: ${{ steps.f1.outcome }}
          OPENF1_OUTCOME: ${{ steps.openf1.outcome }}
          WEC_OUTCOME: ${{ steps.wec.outcome }}
          FIA_OUTCOME: ${{ steps.fia.outcome }}
          WECFIA_OUTCOME: ${{ steps.wecfia.outcome }}
          WECHIGHLIGHTS_OUTCOME: ${{ steps.wechighlights.outcome }}
          WECWINNERS_OUTCOME: ${{ steps.wecwinners.outcome }}
          IMSAFIA_OUTCOME: ${{ steps.imsafia.outcome }}
          IMSAHIGHLIGHTS_OUTCOME: ${{ steps.imsahighlights.outcome }}
          IMSAWINNERS_OUTCOME: ${{ steps.imsawinners.outcome }}
          WINNERS_OUTCOME: ${{ steps.winners.outcome }}
          HIGHLIGHTS_OUTCOME: ${{ steps.highlights.outcome }}
          MILESTONES_OUTCOME: ${{ steps.milestones.outcome }}
          F1HISTORY_OUTCOME: ${{ steps.f1history.outcome }}
          BEASTS_OUTCOME: ${{ steps.beasts.outcome }}
          RECORDS_OUTCOME: ${{ steps.records.outcome }}
          F1OVERRIDES_OUTCOME: ${{ steps.f1overrides.outcome }}
        run: npm run health

      - name: Закоммитить изменения
        if: always()
        uses: ./.github/actions/commit-push
        with:
          paths: data
          message-prefix: snapshot

      # Гейт алерта: любой продьюсер с outcome=failure валит job → GitHub шлёт
      # владельцу письмо. Данные/heartbeat уже закоммичены выше (это отдельный
      # шаг после), поэтому падение не мешает публикации того, что собралось.
      - name: Проверка продьюсеров
        if: always()
        run: |
          FAILED=""
          for p in "imsa=${{ steps.imsa.outcome }}" "f1=${{ steps.f1.outcome }}" \
                   "openf1=${{ steps.openf1.outcome }}" "wec=${{ steps.wec.outcome }}" \
                   "fia=${{ steps.fia.outcome }}" "wecfia=${{ steps.wecfia.outcome }}" "wechighlights=${{ steps.wechighlights.outcome }}" "wecwinners=${{ steps.wecwinners.outcome }}" "imsafia=${{ steps.imsafia.outcome }}" "imsahighlights=${{ steps.imsahighlights.outcome }}" "imsawinners=${{ steps.imsawinners.outcome }}" "winners=${{ steps.winners.outcome }}" "highlights=${{ steps.highlights.outcome }}" "milestones=${{ steps.milestones.outcome }}" "f1history=${{ steps.f1history.outcome }}" "beasts=${{ steps.beasts.outcome }}" "records=${{ steps.records.outcome }}" "f1overrides=${{ steps.f1overrides.outcome }}"; do
            name="${p%%=*}"; outcome="${p##*=}"
            if [ "$outcome" = "failure" ]; then FAILED="$FAILED $name"; fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::упали продьюсеры:$FAILED — см. data/health.json"
            exit 1
          fi
          echo "все продьюсеры ОК"
