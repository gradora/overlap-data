name: tracks

# Справочник трасс из англ-вики (рекорды круга по категориям + notable moments).
# Данные почти статичны — редкий прогон: раз в неделю и по кнопке. Один
# батч-запрос к вики на все трассы (никакого троттлинга).
on:
  schedule:
    - cron: "0 4 * * 1"   # понедельник 04:00 UTC
  workflow_dispatch: {}

# Общая с snapshot группа — не пишем data/ одновременно.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Справочник трасс из вики
        run: npm run tracks

      - name: Закоммитить tracks
        if: always()
        uses: ./.github/actions/commit-push
        with:
          paths: data/tracks
          message-prefix: tracks
