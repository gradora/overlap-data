name: tracks

# Справочник трасс из англ-вики (рекорды круга по категориям + notable moments).
# Данные почти статичны — редкий прогон: раз в неделю и по кнопке. Один
# батч-запрос к вики на все трассы (никакого троттлинга).
on:
  schedule:
    - cron: "0 4 * * 1"   # понедельник 04:00 UTC
  workflow_dispatch: {}

# Общая с snapshot группа — не пишем data/ одновременно.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Справочник трасс из вики
        run: npm run tracks

      - name: Закоммитить tracks
        if: always()
        run: |
          git config user.name  "overlap-bot"
          git config user.email "overlap-bot@users.noreply.github.com"
          git add data/tracks
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "tracks $(date -u +%FT%TZ)"
          # Устойчивый push: гонка со snapshot-коммитом не должна валить.
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then
              echo "push ок с попытки $attempt"
              exit 0
            fi
            echo "::warning::push не удался (попытка $attempt/5), повтор через 10с"
            sleep 10
          done
          echo "::error::push не удался после 5 попыток"
          exit 1
