name: f1live

# Уик-эндовое доснятие F1: держит файл события свежим, пока идёт этап.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ЧАЩЕ snapshot. В полном снапшоте 26 шагов и
# ~2.7 минуты, но в течение уик-энда меняются ровно три вещи: зеркало OpenF1
# (протоколы сессий и рейс-контрол), выведенные из него хайлайты и проекция
# события. Победители — история трассы, они неизменны в сезоне; вехи посчитаны
# по раунду заранее; справочники, рекорды и составы к уик-энду отношения не
# имеют. Гонять из-за трёх продьюсеров все двадцать шесть вчетверо чаще —
# расточительно и к источникам, и к CI.
#
# Решения стюардов доснимает fia.yml (тот же темп, 15 минут по пятницам —
# воскресеньям), поэтому штрафы и протоколы доезжают в файл события в одном
# окне: f1events читает уже обновлённые семейства с диска.
#
# ПОТОЛОК СВЕЖЕСТИ НЕ НАШ. Во время самой живой сессии OpenF1 закрывает
# анонимный доступ (401) — данных в этот момент нет ни у зеркала, ни у
# приложения. Пятнадцать минут — это задержка ПОСЛЕ финиша сессии, и меньше её
# уже не сделать никаким темпом.

on:
  # ВРЕМЕННО ОТКЛЮЧЕНО на время перезаписи истории (вернуть сразу после):
  # schedule:
  # # Пятница—воскресенье, как у решений стюардов.
  # - cron: "*/15 * * * 5,6,0"
  workflow_dispatch:

# ТА ЖЕ группа, что у snapshot: оба пишут data/f1/{openf1,highlights,events}.
# Двум писателям одних файлов в РАЗНЫХ группах уже доводилось затирать работу
# друг друга — повторять не будем.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  f1live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Единственный сетевой шаг: свежие протоколы сессий и рейс-контрол.
      # Продьюсер толерантен — недоступность источника не валит прогон.
      - name: Зеркало OpenF1
        run: npm run openf1

      # Бессетевая деривация из только что снятого зеркала.
      - name: Хайлайты F1
        run: npm run f1highlights

      # Заявка сезона: в пятницу в протоколе появляется резервист, и связать
      # его с человеком надо в том же прогоне, а не через час.
      - name: Заявка сезона F1
        run: npm run f1entrylist

      # Бессетевая проекция семейств в файл события — последней, чтобы забрать
      # и хайлайты этого прогона, и штрафы, доснятые fia.yml.
      - name: Файл события F1
        run: npm run f1events

      - name: Закоммитить F1
        if: always()
        uses: ./.github/actions/commit-push
        with:
          # Ровно то, что пишут три шага выше. Не `data/f1`: решения
          # стюардов (data/f1/fia) принадлежат fia.yml, и захватывать их
          # чужим коммитом — значит гоняться с ним за один файл.
          paths: data/f1/openf1 data/f1/highlights data/f1/entrylist data/f1/events
          message-prefix: f1live
