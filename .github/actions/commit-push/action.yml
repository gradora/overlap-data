name: commit-push
description: >-
  Коммит и устойчивый push изменений data/: до 5 попыток с rebase на свежий
  main (гонка с параллельным workflow или блип GitHub не должны валить job и
  слать ложное письмо). Один блок вместо трёх копий по workflow-файлам.
inputs:
  paths:
    description: Что добавлять в индекс (аргумент git add)
    required: true
  message-prefix:
    description: Префикс сообщения коммита
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name  "overlap-bot"
        git config user.email "overlap-bot@users.noreply.github.com"
        git add ${{ inputs.paths }}
        if git diff --cached --quiet; then
          echo "нет изменений"
          exit 0
        fi
        git commit -m "${{ inputs.message-prefix }} $(date -u +%FT%TZ)"
        for attempt in 1 2 3 4 5; do
          git rebase --abort 2>/dev/null || true
          if git pull --rebase --autostash origin main && git push; then
            echo "push ок с попытки $attempt"
            exit 0
          fi
          echo "::warning::push не удался (попытка $attempt/5), повтор через 10с"
          sleep 10
        done
        echo "::error::push не удался после 5 попыток"
        exit 1
